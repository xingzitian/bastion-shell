name: Build

# 云编译：在 GitHub 的 Windows runner 上出包，本地不用装 WSL/Go/Node 也能拿到最新 exe。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '为已有的 tag 补发 Release（留空则只构建；填了会把这个 tag 的 Release 建出来）'
        required: false
        default: ''

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Go（版本跟着 go.mod 走）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 装 Node（前端构建用）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # wails 依赖 cgo，需要 C 编译器。runner 一般自带 mingw，没带就现装。
      - name: 确保有 C 编译器（cgo 需要）
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            Write-Host "runner 上没有 gcc，用 choco 装 mingw"
            choco install mingw -y --no-progress
          }
          gcc --version

      # ⚠️ 必须先构建前端：main.go 有 `//go:embed all:frontend/dist`，
      # 而 frontend/dist 不入库 —— 少了它连 `go vet` 都会报
      #   pattern all:frontend/dist: no matching files found
      - name: 构建前端
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci
          npm run build
          if (-not (Test-Path dist\index.html)) { throw "前端没有产出 dist/index.html" }
          if (-not (Test-Path dist\shim.js))   { throw "shim.js 没有进 dist（它必须由 public/ 复制过去）" }
          Write-Host "✅ 前端产物就绪"

      - name: 静态检查 + 单元测试
        shell: pwsh
        run: |
          go vet ./...
          go test ./...

      # 版本与本地 build-win.sh 用的保持一致（v2.15.0），避免两边产物不一样
      - name: 安装 wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # -s = 跳过前端构建（上面已经构建过了，避免重复 npm ci）。
      # 其余参数与 build-win.sh 一致：-trimpath -ldflags "-s -w"。
      - name: 构建 Windows 可执行文件
        shell: pwsh
        run: |
          $wails = Join-Path (go env GOPATH) 'bin\wails.exe'
          & $wails build -s -platform windows/amd64 -trimpath -ldflags "-s -w"

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = Get-Item build\bin\BastionShell.exe
          $exe | Format-List Name, Length, LastWriteTime
          if ($exe.Length -lt 5MB) { throw "产物只有 $([math]::Round($exe.Length/1MB,1)) MB，构建可疑" }
          Write-Host "✅ 产物正常：$([math]::Round($exe.Length/1MB,1)) MB"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BastionShell-windows-amd64
          path: build/bin/BastionShell.exe
          if-no-files-found: error

  # 发布：把编好的 exe 挂到 GitHub Release 上 —— 用户直接下载就能用（免安装）。
  # 触发方式两种：
  #   1) 推 v* tag（正常流程）
  #   2) 手动 Run workflow 并填 tag（补发历史版本）
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: windows
    runs-on: ubuntu-latest
    # 默认 token 只读，建 Release 要写权限；只加在这个 job 上，构建 job 仍只读。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布说明取自附注 tag 的注释，需要完整 tag 对象
          fetch-depth: 0

      - name: 取上一步编好的 exe
        uses: actions/download-artifact@v4
        with:
          name: BastionShell-windows-amd64

      - name: 创建 Release 并附上 exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="${{ inputs.tag || github.ref_name }}"
          echo "目标 tag：$tag"

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag 不存在（先在本地 git push origin $tag）"
            exit 1
          fi

          # 产物名带上版本，用户下载时一眼能分清是哪个版本
          mv BastionShell.exe "BastionShell-${tag}-windows-amd64.exe"
          ls -lh ./*.exe

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "该 tag 已有 Release → 只覆盖上传产物"
            gh release upload "$tag" ./*.exe --clobber
          elif git cat-file -t "refs/tags/$tag" | grep -qx tag; then
            echo "用附注 tag 的说明当发布说明"
            gh release create "$tag" ./*.exe --title "$tag" --notes-from-tag
          else
            echo "轻量 tag，没有说明 → 用自动生成的提交记录"
            gh release create "$tag" ./*.exe --title "$tag" --generate-notes
          fi
